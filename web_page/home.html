<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Redirect Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Styling the link */
        a {
            color: #007bff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p id="description">Click the link below to navigate to a different address:</p>
        
        <!-- The href attribute specifies the destination URL -->
        <a id="target-link" href="#">Loading link...</a>
        <p id="last-updated" style="margin-top: 15px; font-size: 0.9em; color: #666;"></p>
    </div>

    <script>
        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                const desc = document.getElementById('description');
                desc.innerText = desc.innerText.replace('different address', data.public_ip);

                const link = document.getElementById('target-link');
                link.href = 'http://' + data.public_ip;
                link.innerText = 'Visit ' + data.public_ip;

                const lastUpdated = document.getElementById('last-updated');
                lastUpdated.innerText = 'Last updated: ' + data.last_updated;
            })
            .catch(error => console.error('Error loading config:', error));
    </script>
</body>
</html>
